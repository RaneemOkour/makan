<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="auto" role="img" aria-label="MAKAN | مكان">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Amiri:wght@400&amp;display=swap');
      .nav-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; font-weight: 600; fill: #352A24; letter-spacing: 6px; }
      .nav-arabic { font-family: 'Amiri', serif; font-size: 34px; font-weight: 400; fill: #352A24; }
      .nav-sep { stroke: #352A24; stroke-width: 1.5; stroke-opacity: 0.35; }
    </style>
    <clipPath id="nav-arch">
      <path d="M 0 100 L 0 44 C 0 19.7 19.7 0 44 0 C 68.3 0 88 19.7 88 44 L 88 100 Z"/>
    </clipPath>
  </defs>

  <!-- رمز القوس المعماري الأردني المتناغم مع الهوية -->
  <g transform="translate(10, 5)">
    <g clip-path="url(#nav-arch)">
      <rect x="0" y="0" width="88" height="100" fill="#E8DFD3"/>
      <circle cx="56" cy="30" r="11" fill="#C98A4B"/>
      <!-- طبقات التلال الدافئة وصخور التيراكوتا -->
      <path d="M -5 74 Q 18 52 38 66 Q 60 80 95 56 L 95 100 L -5 100 Z" fill="#B9684B"/>
      <path d="M -5 84 Q 22 68 45 78 Q 70 88 95 70 L 95 100 L -5 100 Z" fill="#754833"/>
      <path d="M -5 90 Q 15 80 32 88 L 32 100 L -5 100 Z" fill="#585E43"/>
      <path d="M 52 91 Q 70 82 95 86 L 95 100 L 52 100 Z" fill="#585E43"/>
      <!-- مسار الاستكشاف (The Journey) -->
      <path d="M 44 60 Q 38 70 41 74 Q 46 80 30 89 Q 20 94 16 100 L 50 100 Q 53 97 47 90 Q 40 82 50 75 Q 54 70 50 63 Z" fill="#FAF7F1"/>
    </g>
  </g>

  <!-- فاصل عمودي أنيق -->
  <line x1="124" y1="26" x2="124" y2="82" class="nav-sep"/>

  <!-- الاسم الطباعي التحريري (MAKAN | مكان) -->
  <text x="145" y="60" class="nav-title">MAKAN</text>
  <line x1="145" y1="80" x2="190" y2="80" stroke="#352A24" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="202" y="88" class="nav-arabic">مكان</text>
  <line x1="268" y1="80" x2="315" y2="80" stroke="#352A24" stroke-width="1.2" stroke-opacity="0.4"/>
</svg>
